
name: Build PaisaTrack APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'PaisaTrack-Android-Project.zip'
      - '.github/workflows/build.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Extract project
        run: unzip -q PaisaTrack-Android-Project.zip

      - name: Build APK
        run: gradle -p PaisaTrack --no-daemon assembleDebug

      - name: Publish APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: paisatrack-latest
          name: PaisaTrack APK
          files: PaisaTrack/app/build/outputs/apk/debug/app-debug.apk
          overwrite_files: true
